<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Manifold Meter Marquee</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1400px;
      height: 560px;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    }
    body {
      background:
        linear-gradient(115deg, transparent 45%, rgba(155,173,146,.08)),
        radial-gradient(circle at 76% 24%, rgba(208,166,93,.16), transparent 30%),
        #0e0f0d;
      color: #e3dfd7;
    }
    main {
      height: 100%;
      padding: 88px 110px;
      display: grid;
      grid-template-columns: 1fr 480px;
      align-items: center;
      gap: 92px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 44px;
    }
    img { width: 52px; height: 52px; }
    .brand {
      margin: 0;
      color: #d0a65d;
      font-size: 24px;
      font-weight: 550;
      letter-spacing: .22em;
    }
    .product {
      margin: 5px 0 0;
      color: #9c978e;
      font-size: 11px;
      letter-spacing: .34em;
    }
    h1 {
      margin: 0;
      font-size: 56px;
      font-weight: 460;
      line-height: 1.16;
      letter-spacing: -.035em;
    }
    h1 span { color: #9bad92; }
    .copy {
      margin: 24px 0 0;
      color: #9c978e;
      font-size: 19px;
      letter-spacing: .02em;
    }
    .meter {
      padding: 38px 40px;
      border: 1px solid #35342f;
      background: rgba(19,20,17,.92);
      box-shadow: 0 28px 80px rgba(0,0,0,.32);
    }
    .meter-top {
      display: flex;
      justify-content: space-between;
      color: #d0a65d;
      font-size: 13px;
      letter-spacing: .12em;
    }
    .value {
      margin-top: 30px;
      display: flex;
      align-items: flex-end;
      color: #9bad92;
      line-height: .85;
    }
    .value strong {
      font-size: 132px;
      font-weight: 420;
      letter-spacing: -.07em;
    }
    .value span {
      margin: 0 0 10px 14px;
      font-size: 54px;
    }
    .track {
      height: 7px;
      margin-top: 34px;
      background: #292825;
    }
    .track::before {
      content: "";
      display: block;
      width: 57%;
      height: 100%;
      background: #9bad92;
    }
    .foot {
      margin: 18px 0 0;
      color: #9c978e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <header>
        <img src="../../icons/logo.svg" alt="" />
        <div>
          <p class="brand">MANIFOLD</p>
          <p class="product">METER</p>
        </div>
      </header>
      <h1>把 Codex 用量<br />放到<span>余光里。</span></h1>
      <p class="copy">工具栏与副屏上的本地优先用量仪表盘</p>
    </section>
    <section class="meter">
      <div class="meter-top"><span>5小时额度</span><span>02:14 重置</span></div>
      <div class="value"><strong>57</strong><span>%</span></div>
      <div class="track"></div>
      <p class="foot">本周额度剩余 73% · 同步正常</p>
    </section>
  </main>
</body>
</html>
