<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Manifold Meter Promo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 440px;
      height: 280px;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    }
    body {
      position: relative;
      background:
        radial-gradient(circle at 82% 18%, rgba(173,145,96,.22), transparent 36%),
        #151412;
      color: #cbc6bb;
    }
    body::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid #38342f;
    }
    main {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 42px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      display: flex;
      align-items: center;
      gap: 13px;
    }
    img { width: 38px; height: 38px; }
    .brand {
      margin: 0;
      color: #c7a36a;
      font-size: 18px;
      font-weight: 560;
      letter-spacing: .2em;
    }
    .product {
      margin: 4px 0 0;
      color: #807a71;
      font-size: 9px;
      letter-spacing: .3em;
    }
    h1 {
      max-width: 330px;
      margin: 0;
      font-size: 30px;
      font-weight: 470;
      line-height: 1.24;
      letter-spacing: -.025em;
    }
    .accent { color: #81927a; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../../icons/logo.svg" alt="" />
      <div>
        <p class="brand">MANIFOLD</p>
        <p class="product">METER</p>
      </div>
    </header>
    <h1>让 Codex <span class="accent">剩余额度</span><br />始终清晰可见。</h1>
  </main>
</body>
</html>
