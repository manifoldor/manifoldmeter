<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manifold Meter — 工具栏界面</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1280px;
      height: 800px;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 22%, rgba(208,166,93,.1), transparent 32%),
        #0e0f0d;
      color: #d8d4cb;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    }
    main {
      width: 100%;
      height: 100%;
      padding: 92px 104px;
      display: grid;
      grid-template-columns: 1fr 430px;
      align-items: center;
      gap: 96px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 30px;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #d0a65d;
      font-size: 18px;
      letter-spacing: .18em;
    }
    h1 {
      max-width: 620px;
      margin: 0;
      color: #e3dfd7;
      font-size: 64px;
      font-weight: 480;
      line-height: 1.12;
      letter-spacing: -.035em;
    }
    .copy {
      max-width: 560px;
      margin: 28px 0 0;
      color: #9c978e;
      font-size: 21px;
      line-height: 1.65;
    }
    .feature-row {
      margin-top: 38px;
      display: flex;
      gap: 12px;
    }
    .feature-row span {
      padding: 9px 13px;
      border: 1px solid #35342f;
      color: #d8d4cb;
      font-size: 14px;
    }
    .frame {
      width: 430px;
      height: 550px;
      padding: 24px;
      border: 1px solid #35342f;
      border-radius: 24px;
      background: #131411;
      box-shadow: 0 30px 90px rgba(0,0,0,.46);
    }
    iframe {
      width: 380px;
      height: 500px;
      border: 0;
      border-radius: 10px;
      background: #0e0f0d;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <img class="logo" src="../../icons/logo.svg" alt="" />
      <p class="eyebrow">MANIFOLD METER</p>
      <h1>Codex 剩余额度，随时抬眼可见。</h1>
      <p class="copy">5小时额度、本周额度与重置时间，在 Chrome 工具栏里保持安静、清晰和准确。</p>
      <div class="feature-row">
        <span>本地优先</span>
        <span>自动同步</span>
        <span>无遥测</span>
      </div>
    </section>
    <div class="frame">
      <iframe
        src="../../popup.html?demo-now=2026-07-05T09%3A00%3A00%2B08%3A00"
        title="Manifold Meter 工具栏弹窗"
      ></iframe>
    </div>
  </main>
</body>
</html>
